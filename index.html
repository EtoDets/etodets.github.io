<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замена букв</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        textarea {
            width: 70%;
            max-width: 500px;
            margin: 10px 0;
            padding: 8px;
            font-size: 14px;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            margin: 5px;
        }
        .example {
            margin: 20px 0;
            font-size: 16px;
            font-weight: bold;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .copied-message {
            display: none;
            margin-top: 10px;
            color: green;
            font-size: 14px;
        }
    </style>
    <script>
        function replaceLetters() {
            const inputText = document.getElementById("inputText").value;
            const replacements = {
                'А': 'A', 'Б': '6', 'В': 'B', 'Г': 'r', 'Д': 'D', 'Е': 'E', 'Ё': 'E', 'Ж': ')I(', 'З': '3',
                'И': 'u', 'К': 'K', 'Л': 'Jl', 'М': 'M', 'Н': 'H', 'О': 'O', 'П': 'n', 'Р': 'p', 'С': 'C',
                'Т': 'T', 'У': 'Y', 'Ф': 'F', 'Х': 'X', 'Ц': 'u', 'Ч': '4', 'Ш': 'W', 'Щ': 'W', 'Ъ': '',
                'Ы': 'bl', 'Ь': 'b', 'Э': 'E', 'Ю': 'I-O', 'Я': '9l',
                'а': 'a', 'б': '6', 'в': 'B', 'г': 'r', 'д': 'g', 'е': 'e', 'ё': 'e', 'ж': ')l(', 'з': '3',
                'и': 'u', 'к': 'k', 'л': 'Jl', 'м': 'm', 'н': 'H', 'о': 'o', 'п': 'n', 'р': 'p', 'с': 'c',
                'т': 't', 'у': 'y', 'ф': 'f', 'х': 'x', 'ц': 'u', 'ч': '4', 'ш': 'w', 'щ': 'w', 'ъ': '',
                'ы': 'bl', 'ь': 'b', 'э': 'e', 'ю': 'l-o', 'я': '9l'
            };

            let outputText = inputText.split('').map(char => replacements[char] || char).join('');
            document.getElementById("outputText").value = outputText;
        }

        function copyToClipboard() {
            const outputText = document.getElementById("outputText");
            outputText.select();
            document.execCommand("copy");

            const copiedMessage = document.getElementById("copiedMessage");
            copiedMessage.style.display = "block";
            setTimeout(() => {
                copiedMessage.style.display = "none";
            }, 200); // timer
        }

        function clearResult() {
            document.getElementById("outputText").value = '';
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("inputText").addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    replaceLetters();
                }
            });
        });
    </script>
</head>
<body>
    <h1>Замена русских букв на латинские символы</h1>
    <textarea id="inputText" rows="6" placeholder="Введите текст..."></textarea>
    <button onclick="replaceLetters()">Заменить</button>
    <textarea id="outputText" rows="6" placeholder="Результат..." readonly></textarea>

    <div class="button-group">
        <button onclick="copyToClipboard()">Скопировать результат</button>
        <button onclick="clearResult()">Очистить результат</button>
    </div>

    <div id="copiedMessage" class="copied-message">Результат скопирован!</div>

    <div class="example">Пример: "Привет" → "npuBet"</div>
    <ul>
        <li><a href="site1/index.html">Сайт 1</a></li>
    </ul>
</body>
</html>
