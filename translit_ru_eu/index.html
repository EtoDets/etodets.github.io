<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Русские имена (ники) латинскими буквами</title>
  <style>
    body { font: 16px Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    main { width: fit-content; max-width: calc(100% - 32px); margin: 42px auto; text-align: center; }
    footer { margin-top: auto; padding: 20px; text-align: center; }
    table { margin: 0 auto; }
    p { margin: 0; }
    .table-wrap { overflow-x: auto; margin: 20px 0 36px; }
    table { border-spacing: 4px 2px; }
    td { padding: 0; white-space: nowrap; }
    tr:nth-child(3) td { padding-top: 24px; }
    form { margin-bottom: 34px; }
    input[type="text"], #result { box-sizing: border-box; max-width: 100%; }
    #text { width: 311px; }
    #result { width: 360px; }
  </style>
  <script src="converter.js" defer></script>
</head>
<body>
<main>
  <p>Сервис для замены русских букв похожими латинскими символами.<br>
  Заменяет русские слова на похожие, написанные латинским шрифтом.<br>
  Например, "У" заменяет на "Y", "к"- на латинскую "k", "б" на цифру 6 и т. п.</p>
  <div class="table-wrap"><table aria-label="Таблица замены символов"><tbody id="mapping"></tbody></table></div>
  <form id="form">
    <label for="text"><b>Исходное слово:</b></label>
    <input name="text" type="text" size="40" id="text">
    <button type="submit">Перекодировать</button>
  </form>
  <div><label for="result"><b>Результат:</b></label> <input id="result" size="47" readonly> <button type="button" id="copy">Копировать</button> <span id="copy-status" role="status"></span></div>
</main>
<footer><a href="../index.html">← Главное меню</a></footer>
</body>
</html>
